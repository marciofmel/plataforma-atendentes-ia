services:
  - type: web
    name: plataforma-atendentes-ia
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --skip-generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plataforma-atendentes-db
          property: connectionString

databases:
  - name: plataforma-atendentes-db
    plan: free
    region: virginia
